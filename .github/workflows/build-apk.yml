name: Build Melkite Prayers APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Salawat_Malkiyeh_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q Salawat_Malkiyeh_Android_Project.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/Salawat_Malkiyeh_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salawat-Malkiyeh-APK
          path: extracted/Salawat_Malkiyeh_Android/app/build/outputs/apk/debug/app-debug.apk
